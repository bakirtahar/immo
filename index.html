/* Layout : barre latérale violet nuit + zone de travail sombre ; tableaux et champs blancs (charte CTB) */
:root {
  --bg: #22073F;           /* fond principal violet nuit */
  --bg-2: #2E0E56;         /* bandes, barre latérale */
  --bg-3: #3B1670;         /* survols sur fond sombre */
  --accent: #7542E5;       /* boutons, liens, sélection */
  --accent-2: #9C74FF;     /* accent clair sur fond sombre */
  --soft: #D9CCFF;         /* lavande (encarts) */
  --soft-2: #F1ECFF;       /* lavande très pâle (lignes paires, en-têtes) */
  --paper: #FFFFFF;        /* tableaux et champs */
  --ink: #1D1030;          /* texte sur blanc */
  --ink-2: #5D5274;        /* texte secondaire sur blanc */
  --line: #E4DDF0;         /* filets sur blanc */
  --on-dark: #F5F0FF;      /* texte sur fond sombre */
  --on-dark-2: #B7A6D9;    /* texte secondaire sur fond sombre */
  --ok: #17885C; --ok-bg: #E2F5EC;
  --warn: #A86A00; --warn-bg: #FFF2D6;
  --bad: #C2334E; --bad-bg: #FDE6EA;
  --info-bg: #ECE5FF;
  --font-display: "Mozilla Headline", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--on-dark);
  font: 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 650; font-stretch: 85%; letter-spacing: -.005em; margin: 0; text-wrap: balance; line-height: 1.08; }
h1 { font-stretch: 78%; font-weight: 640; }
h3, h4 { font-stretch: 92%; }
a { color: var(--accent-2); }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--on-dark-2); }
.hidden { display: none !important; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: 12px; color: var(--accent-2); font-weight: 600; }

/* ---------- Connexion ---------- */
.login {
  min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 420px); gap: 48px; align-items: center;
  padding-block: 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  max-width: 1180px; margin: 0 auto; position: relative;
}
.glow { position: fixed; inset: auto 0 0 0; height: 55vh; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 115%, rgba(117, 66, 229, .75), rgba(117, 66, 229, .18) 55%, transparent 75%); }
.login > * { position: relative; z-index: 1; }
.login-pitch h1 { font-size: clamp(64px, 10vw, 128px); color: #fff; margin: 8px 0 14px; line-height: .95; letter-spacing: -.01em; }
.login-pitch p { font-size: 17px; color: var(--on-dark); max-width: 52ch; margin: 0 0 22px; }
.login-card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 28px; box-shadow: 0 30px 80px rgba(10, 0, 30, .45); color-scheme: light; }
.login-card h2 { font-size: 30px; margin-bottom: 4px; }
.login-card .sub { color: var(--ink-2); margin: 0 0 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 40px; width: auto; max-width: 160px; display: block; }
.brand-app { font-family: var(--font-display); font-stretch: 85%; font-weight: 640; font-size: 30px; line-height: 1; color: #fff; padding-left: 12px; border-left: 1px solid rgba(217, 204, 255, .35); }
.login-pitch .brand img { height: 72px; }
.store-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-dark-2); }
.store-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.store-badge.db::before { background: #3DDC97; }

/* ---------- Coquille de l'application ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--bg-2); display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid rgba(217, 204, 255, .08); }
.side .brand { padding: 4px 8px 10px; }
.nav { display: grid; gap: 2px; }
.nav-sep { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--on-dark-2); padding: 14px 10px 6px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--on-dark); font-size: 14px; }
.nav button svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.nav button:hover { background: var(--bg-3); }
.nav button.on { background: var(--accent); color: #fff; }
.nav button.on svg { opacity: 1; }
.nav button:focus-visible { outline: 2px solid var(--accent-2); }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--on-dark-2); display: grid; gap: 8px; padding: 0 8px; }

.main { min-width: 0; display: flex; flex-direction: column; position: relative; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(34, 7, 63, .92); backdrop-filter: blur(8px);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid rgba(217, 204, 255, .08); }
.top-title { min-width: 0; flex: 1; }
.top-title h1 { font-size: 30px; color: #fff; }
.top-title .crumb { font-size: 12.5px; color: var(--on-dark-2); }
.top-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip-user { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; background: var(--bg-3); color: var(--on-dark); font-size: 13px; border: 0; }
.chip-user .av { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: #fff; }
.impersonate { background: var(--soft); color: var(--ink); padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color-scheme: light; }
.content { padding-block: 22px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; position: relative; z-index: 1; }
.content > * { min-width: 0; }

/* ---------- Éléments ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 18px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, transform .1s; }
.btn:hover { background: #6534d3; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.ghost:hover { background: var(--soft-2); }
.on-dark .btn.ghost, .top .btn.ghost, .page-head .btn.ghost { color: var(--on-dark); box-shadow: inset 0 0 0 1.5px rgba(217, 204, 255, .45); }
.on-dark .btn.ghost:hover, .top .btn.ghost:hover, .page-head .btn.ghost:hover { background: var(--bg-3); }
.btn.danger { background: var(--bad); }
.btn.danger:hover { background: #a9273f; }
.btn.light { background: var(--soft-2); color: var(--accent); }
.btn.light:hover { background: var(--soft); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--accent); }

.page-head { display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-head h2 { font-size: 26px; color: #fff; }
.page-head p { margin: 4px 0 0; color: var(--on-dark-2); max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.panel { background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 18px; color-scheme: light; box-shadow: 0 10px 30px rgba(8, 0, 24, .25); min-width: 0; }
.panel h3 { font-size: 21px; margin-bottom: 12px; color: var(--ink); }
.panel .muted, .modal .muted { color: var(--ink-2); }
.panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; color-scheme: light; }
.kpi .l { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.1vw, 30px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-2); }
.kpi.hero { background: var(--soft); }

/* Tableaux */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--ink); }
.tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); background: var(--soft-2); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl th.num { text-align: right; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover td { background: #FAF8FF; }
.tbl tr.click { cursor: pointer; }
.tbl tfoot td { font-weight: 700; background: var(--soft-2); border-top: 2px solid var(--soft); border-bottom: 0; }
.tbl tr.group td { background: #F7F4FF; font-weight: 600; color: var(--accent); }
.tbl .code { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.tbl input, .tbl select { width: 100%; min-width: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
.tbl input[type=checkbox] { width: auto; min-width: 0; }
.empty { padding: 34px 18px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty b { color: var(--ink); font-size: 15px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--info-bg); color: var(--accent); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.grey { background: #EEEBF3; color: #5d5670; }

/* Formulaires */
.form { display: grid; gap: 14px; }
.fs { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; margin: 0; min-width: 0; align-content: start; }
.fs legend { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 0 6px; color: var(--accent); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field > span em { color: var(--bad); font-style: normal; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid #D7CEE8; border-radius: 9px; background: #fff; color: var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: 2px solid rgba(117, 66, 229, .2); }
.field small { color: var(--ink-2); font-size: 11.5px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); }
.check input, .field .check input, .field input[type=checkbox], .field input[type=radio] { width: auto; flex: none; margin: 0; }
.check > span { min-width: 0; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.toolbar .field { min-width: 150px; flex: 1; }
.toolbar .field.wide { flex: 2; min-width: 220px; }
.note { background: var(--info-bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.note.warn { background: var(--warn-bg); }
.note.bad { background: var(--bad-bg); }
.on-dark .note { background: rgba(217, 204, 255, .12); color: var(--on-dark); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: -4px 0 14px; }
.tabs button { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 8px 8px 0 0; font-weight: 600; color: var(--ink-2); font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }

.dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 18px; margin: 0; }
.dl div { min-width: 0; }
.dl dt { font-size: 11.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.dl dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }

.asset-head { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.asset-code { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.code-parts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.code-parts span { background: var(--soft-2); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; color: var(--ink-2); }
.code-parts b { font-family: var(--font-mono); color: var(--ink); }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 14px; background: var(--soft-2); border-radius: 4px; position: relative; overflow: hidden; }
.bar-vb { position: absolute; inset: 0 auto 0 0; background: var(--soft); border-radius: 4px; }
.bar-vnc { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--soft-2); font-size: 13px; }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--accent); }
.alert.warn .dot { background: var(--warn); }
.alert.bad .dot { background: var(--bad); }
.alert.ok .dot { background: var(--ok); }

.scan { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.scan input { font-family: var(--font-mono); font-size: 20px; letter-spacing: .06em; padding: 12px 14px; border: 2px solid var(--accent); border-radius: 12px; width: 100%; background: #fff; color: var(--ink); }
.scan-log { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
.scan-log div { display: flex; gap: 10px; align-items: center; font-size: 12.5px; padding: 6px 10px; background: var(--soft-2); border-radius: 8px; }
.progress { height: 10px; border-radius: 999px; background: var(--soft-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.labels-prev { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.label-card { border: 1px dashed #CBBFE3; border-radius: 8px; padding: 10px; display: grid; gap: 4px; background: #fff; }
.label-card .t { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-2); gap: 8px; }
.label-card svg { width: 100%; height: 56px; }
.label-card .c { font-family: var(--font-mono); font-weight: 600; text-align: center; font-size: 13px; }
.label-card .d { font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.swatch { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line); padding: 0; }
.logo-prev { background: var(--bg); border-radius: 10px; padding: 14px; display: inline-flex; align-items: center; gap: 12px; }
.logo-prev img { max-height: 54px; max-width: 220px; }

/* Fenêtre modale */
.modal-bg { position: fixed; inset: 0; background: rgba(12, 2, 28, .62); z-index: 100; display: grid; place-items: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--paper); color: var(--ink); border-radius: 16px; width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 30px 90px rgba(0, 0, 0, .5); color-scheme: light; }
.modal.wide { width: min(1080px, 100%); }
.modal.narrow { width: min(460px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { font-size: 23px; }
.modal-b { padding: 18px 20px; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.modal-h, .modal-f { flex: none; }
.modal-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.x { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); font-size: 20px; }
.x:hover { background: var(--soft-2); }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 200; }
.toast { background: #fff; color: var(--ink); padding: 11px 16px; border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); font-size: 13.5px; border-left: 4px solid var(--accent); max-width: 380px; }
.toast.ok { border-left-color: var(--ok); }
.toast.bad { border-left-color: var(--bad); }

.loading { display: grid; place-items: center; min-height: 60vh; color: var(--on-dark-2); gap: 12px; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(217, 204, 255, .25); border-top-color: var(--accent-2); animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .btn { transition: none; } }

@media (max-width: 1100px) { .grid-3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1560px) { .kpis.k6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1280px) { .kpis.k6, .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .kpis, .kpis.k6, .kpis.k5, .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .login { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 28px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 10px; }
  .side .brand { padding: 0; }
  .nav { display: flex; gap: 4px; overflow-x: auto; width: 100%; padding-bottom: 4px; }
  .nav-sep { display: none; }
  .nav button { white-space: nowrap; }
  .side-foot { display: none; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; }
  .top-title h1 { font-size: 24px; }
}
@media (max-width: 520px) {
  .top, .content, .impersonate { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .panel { padding: 14px; }
  .modal-b { padding: 14px; }
}

/* ---------- Titres et chiffres en Mozilla Headline ---------- */
.kpi .v { font-stretch: 88%; font-weight: 640; overflow-wrap: anywhere; }
.fs legend { font-stretch: 92%; font-weight: 650; }
.asset-head h3 { font-stretch: 82%; }

/* ---------- Événements NC 05 ---------- */
.ev-list { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.ev .d { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
.ev .t { font-weight: 600; }
.ev .x2 { font-size: 12.5px; color: var(--ink-2); }
.ev-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.subgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
details.more { border: 1px dashed #D7CEE8; border-radius: 10px; padding: 8px 12px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details.more[open] summary { margin-bottom: 10px; }
.calc-line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dotted var(--line); font-size: 13px; }
.calc-line b { font-variant-numeric: tabular-nums; }
.calc-line.total { border-bottom: 0; font-weight: 700; }
.result { border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
.result.ok { background: var(--ok-bg); }
.result.warn { background: var(--warn-bg); }
.result.bad { background: var(--bad-bg); }
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.status-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; background: #fff; }
.status-card h4 { font-size: 18px; }

/* ---------- Notes aux états financiers ---------- */
.notes-doc { display: grid; gap: 18px; max-width: 980px; }
.notes-doc section { display: grid; gap: 8px; }
.notes-doc h4 { font-size: 19px; color: var(--accent); }
.notes-doc p { margin: 0; max-width: 85ch; }
.notes-doc .tbl-wrap { margin-top: 4px; }

/* ---------- Manuel ---------- */
.manual { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.manual-toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 14px; max-height: calc(100vh - 120px); overflow-y: auto; color-scheme: light; }
.manual-toc b { display: block; font-family: var(--font-display); font-stretch: 88%; font-size: 18px; margin-bottom: 8px; }
.manual-toc a { display: block; padding: 5px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 13px; }
.manual-toc a:hover { background: var(--soft-2); color: var(--accent); }
.manual-body { display: grid; gap: 16px; min-width: 0; }
.manual-body .panel h3 { font-size: 26px; scroll-margin-top: 110px; }
.manual-body .panel h4 { font-size: 18px; margin: 14px 0 6px; color: var(--accent); }
.manual-body p, .manual-body li { max-width: 80ch; }
.manual-body p { margin: 0 0 10px; }
.manual-body ul, .manual-body ol { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 4px; }
.manual-body .tip { background: var(--info-bg); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; font-size: 13px; }
.manual-body .ref { color: var(--ink-2); font-size: 12px; }
.manual-hero { display: grid; gap: 8px; }
.manual-hero h2 { font-size: clamp(32px, 4.6vw, 54px); color: #fff; font-stretch: 78%; }
.manual-hero p { color: var(--on-dark); max-width: 70ch; margin: 0; }
@media (max-width: 900px) {
  .manual { grid-template-columns: minmax(0, 1fr); }
  .manual-toc { position: static; max-height: none; }
  .ev { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

/* Contrats enregistrés, pièces comptables */
.ctr-list { display: grid; gap: 10px; }
.ctr-list:empty { display: none; }
.ctr-row { display: grid; grid-template-columns: minmax(170px, 1.3fr) minmax(130px, 1fr) minmax(130px, .9fr) minmax(130px, 1fr) minmax(150px, 1.2fr) auto; gap: 10px; align-items: end; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; background: #FBFAFE; }
.ctr-row .ctr-del { margin-bottom: 4px; }
.piece-tag { font-size: 12px; color: var(--ink-2); }
.piece-tag .pv { font-family: var(--font-mono); white-space: nowrap; }
.piece-tag.missing .pv, .piece-tag.optional .pv { font-family: inherit; white-space: normal; }
.piece-tag.missing { color: var(--warn); }
.piece-tag.optional { color: var(--ink-2); font-style: italic; }
.piece-tag .link { font-size: 12px; white-space: nowrap; margin-left: 4px; }
.fs > .btn { justify-self: start; }
.ev .x2 + .x2 { margin-top: 4px; }
@media (max-width: 900px) { .ctr-row { grid-template-columns: 1fr 1fr; } .ctr-row .ctr-del { justify-self: start; } }
@media (max-width: 520px) { .ctr-row { grid-template-columns: minmax(0, 1fr); } }

/* Évaluation NC 05 : diligences de clôture */
.step-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
.step-card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #fff; border-left: 4px solid var(--soft); }
.step-card span { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.step-card b { font-size: 14.5px; color: var(--ink); }
.step-card.ok { border-left-color: var(--ok); }
.step-card.todo { border-left-color: var(--warn); }
.step-card.todo b { color: var(--warn); }
.step-card:hover { box-shadow: 0 0 0 2px var(--soft); }
.step-card:focus-visible { outline: 2px solid var(--accent-2, #b9a2ff); outline-offset: 2px; }
@media (max-width: 1100px) { .step-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .step-strip { grid-template-columns: minmax(0, 1fr); } }
.store-warn { background: var(--warn-bg); color: #5A3A00; border-left: 4px solid var(--warn); padding: 10px 16px; font-size: 13px; line-height: 1.45; }
.login-card .store-warn { border-radius: 8px; margin: 0 0 14px; }
.eval-stack { display: grid; gap: 14px; }
.ind-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 6px 18px; }
.eval-stack .rr-com { min-width: 220px; }
.rr-cell { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
